# Per-repo lefthook config. Pulls the shared commit-msg + stack stop-gate jobs from
# dotfiles via `remotes:`; defining `stop-gate` jobs is this repo's opt-in to the
# user-global Claude Code stop-gate wrapper (dotfiles docs/adr/0001-hook-enforcement-stack.md).
# Green-baseline verified 2026-07-13: clippy -D warnings, cargo test, dart analyze, and
# flutter test all pass. lefthook owns commit-msg AND pre-push here: core.hooksPath is
# unset and the hand-written .githooks/pre-push was retired in favour of the shared and
# local `pre-push:` jobs (dotfiles #31).
remotes:
  - git_url: https://github.com/RobinCombrink/actions-conventional-commits
    ref: main
  - git_url: https://github.com/RobinCombrink/dotfiles
    ref: main
    configs:
      - lefthook/commit-msg.yml
      - lefthook/rust.yml
      - lefthook/flutter.yml

# Path-scoped CI gate, run once per push (ported from the retired .githooks/pre-push).
# `glob` gates each group against lefthook's push_files list (git diff HEAD @{push}), so an
# unrelated push skips it; `piped: true` stops the group at the first failing step, matching
# the old hook's `set -e`.
#
# The Rust fmt/clippy/test triple that used to live here is now the shared `pre-push` job in
# dotfiles' lefthook/rust.yml, pulled in by the `remotes:` block above — one home for the
# stack gate rather than a copy per repo. Only the postgres acceptance step is polyphony's
# own, so only it remains, under a name distinct from the shared `rust` job: a same-named
# local job merges with the remote one field-wise rather than replacing it, which silently
# rescopes the glob (see the merge-hazard note in dotfiles' lefthook/rust.yml).
#
# `cargo build --workspace --all-targets` went with the triple and is not reinstated: the
# shared job's `clippy --all-targets` and `test --all-targets` each compile every target, so
# it only ever paid for the same codegen a third time.
pre-push:
  jobs:
    - name: polyphony-postgres-bdd
      glob:
        - "*.rs"
        - "Cargo.toml"
        - "Cargo.lock"
      env:
        BDD_STORE: postgres
      run: cargo test -p backend-api --tests
    - name: flutter
      glob:
        - "apps/flutter_client/**"
      group:
        piped: true
        jobs:
          - name: flutter pub get
            run: cd apps/flutter_client ; flutter pub get
          - name: flutter analyze
            run: cd apps/flutter_client ; flutter analyze
          - name: dart format check
            run: cd apps/flutter_client ; dart format --output=none --set-exit-if-changed lib test
          - name: flutter test
            run: cd apps/flutter_client ; flutter test

# Postgres BDD suite, scoped to storage-layer changes in the current dirty set (the
# per-turn analogue of the pre-push hook, which runs it on any Rust change per push).
stop-gate:
  jobs:
    - name: polyphony-postgres-bdd
      files: git ls-files --modified --others --exclude-standard
      glob: "crates/backend-storage/**"
      env:
        BDD_STORE: postgres
      run: cargo test -p backend-api --tests
